<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACSM 運動處方速查 · 12th Edition</title>
<style>
  :root{
    --ink:#1a1d23; --ink-soft:#5a6270; --line:#e3e6ec; --line-soft:#eef0f4;
    --paper:#fbfbf9; --panel:#ffffff;
    --accent:#0d6b5e;       /* 深青綠 — 臨床/醫療沉穩 */
    --accent-soft:#e6f2ef;
    --aerobic:#0d6b5e; --resist:#9a5b1e; --flex:#4a5db8; --extra:#7a3b8f;
    --warn-bg:#fdf6ec; --warn-line:#e9d4a8;
    --radius:0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    line-height:1.6; font-size:15px;
    display:flex; min-height:100vh;
  }
  /* ===== 側邊選單 ===== */
  .sidebar{
    width:300px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); height:100vh; position:sticky; top:0;
    display:flex; flex-direction:column;
  }
  .brand{
    padding:22px 22px 16px; border-bottom:1px solid var(--line);
  }
  .brand h1{
    font-size:17px; font-weight:800; letter-spacing:-0.01em;
    display:flex; align-items:baseline; gap:8px;
  }
  .brand .tag{
    font-size:10px; font-weight:700; color:var(--accent);
    border:1px solid var(--accent); padding:1px 5px; letter-spacing:0.04em;
  }
  .brand p{font-size:11.5px; color:var(--ink-soft); margin-top:5px; letter-spacing:0.02em}
  .search-wrap{padding:14px 18px 8px}
  .search-wrap input{
    width:100%; border:1px solid var(--line); padding:9px 12px;
    font-size:13px; font-family:inherit; background:var(--paper);
    border-radius:var(--radius); outline:none; transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--accent)}
  .menu{flex:1; overflow-y:auto; padding:4px 0 30px}
  /* ===== 階層導覽 ===== */
  .nav-intro{font-size:12px; color:var(--ink-soft); padding:16px 22px 10px; letter-spacing:0.02em}
  .nav-empty{font-size:13px; color:var(--ink-soft); padding:16px 22px}
  .big-btn{
    display:flex; align-items:center; gap:14px; width:calc(100% - 28px); margin:8px 14px;
    padding:18px 16px; border:1px solid var(--line); background:var(--panel); cursor:pointer;
    font-family:inherit; text-align:left; transition:border-color .15s, background .15s, transform .08s;
  }
  .big-btn:hover{border-color:var(--accent); background:var(--accent-soft); transform:translateY(-1px)}
  .bb-icon{font-size:26px; line-height:1; flex-shrink:0}
  .bb-text{flex:1; display:flex; flex-direction:column; gap:2px; min-width:0}
  .bb-zh{font-size:16px; font-weight:800; color:var(--ink); letter-spacing:-0.01em}
  .bb-en{font-size:11px; color:var(--ink-soft); letter-spacing:0.02em}
  .bb-sub{font-size:11px; color:var(--accent); font-weight:600; margin-top:2px}
  .bb-arrow{font-size:22px; color:var(--ink-soft); flex-shrink:0; font-weight:300}
  .big-btn:hover .bb-arrow{color:var(--accent)}
  .cat-btn{
    display:flex; align-items:center; gap:10px; width:calc(100% - 28px); margin:5px 14px;
    padding:13px 15px; border:1px solid var(--line); background:var(--panel); cursor:pointer;
    font-family:inherit; text-align:left; transition:border-color .15s, background .15s;
  }
  .cat-btn:hover{border-color:var(--accent); background:var(--accent-soft)}
  .cb-name{flex:1; font-size:14px; font-weight:700; color:var(--ink)}
  .cb-count{font-size:11px; color:var(--ink-soft); background:var(--line-soft); padding:2px 8px; border-radius:10px}
  .cat-btn:hover .bb-arrow{color:var(--accent)}
  .back-btn{
    display:block; width:100%; text-align:left; border:none; background:none; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:600; color:var(--accent);
    padding:14px 22px 8px; transition:opacity .12s;
  }
  .back-btn:hover{opacity:0.65}
  .cat-label{
    font-size:10.5px; font-weight:800; letter-spacing:0.1em; color:var(--ink-soft);
    text-transform:uppercase; padding:14px 22px 6px;
  }
  .menu-item{
    display:block; width:100%; text-align:left; border:none; background:none;
    font-family:inherit; cursor:pointer; padding:8px 22px 8px 22px;
    font-size:13.5px; color:var(--ink); border-left:3px solid transparent;
    transition:background .12s, border-color .12s;
  }
  .menu-item:hover{background:var(--line-soft)}
  .menu-item.active{background:var(--accent-soft); border-left-color:var(--accent); font-weight:700}
  .menu-item .en{display:block; font-size:11px; color:var(--ink-soft); margin-top:1px}
  .menu-item.active .en{color:var(--accent)}
  .badge-full{
    display:inline-block; font-size:9px; font-weight:700; color:#fff; background:var(--accent);
    padding:1px 5px; margin-left:6px; vertical-align:middle; letter-spacing:0.03em;
  }

  /* ===== 主內容 ===== */
  .main{flex:1; min-width:0; padding:40px 48px 80px; max-width:1100px}
  .empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:70vh; text-align:center; color:var(--ink-soft);
  }
  .empty svg{opacity:.35; margin-bottom:18px}
  .empty h2{font-size:19px; color:var(--ink); font-weight:700; margin-bottom:8px}
  .empty p{font-size:14px; max-width:380px}

  .doc-head{border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:4px}
  .doc-head .cat-pill{
    display:inline-block; font-size:11px; font-weight:700; color:var(--accent);
    background:var(--accent-soft); padding:3px 9px; letter-spacing:0.03em; margin-bottom:10px;
  }
  .doc-head h2{font-size:28px; font-weight:800; letter-spacing:-0.02em; line-height:1.2}
  .doc-head .en-title{font-size:15px; color:var(--ink-soft); font-weight:500; margin-top:3px}
  .doc-head .page-ref{font-size:12px; color:var(--ink-soft); margin-top:10px}
  .doc-head .page-ref b{color:var(--accent); font-weight:700}

  .section-label{
    font-size:12px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft); margin:34px 0 14px; display:flex; align-items:center; gap:10px;
  }
  .section-label::after{content:""; flex:1; height:1px; background:var(--line)}

  /* FITT 表格 */
  .fitt-table{width:100%; border-collapse:collapse; font-size:13px}
  .fitt-table th, .fitt-table td{
    border:1px solid var(--line); padding:11px 13px; vertical-align:top; text-align:left;
  }
  .fitt-table thead th{
    background:var(--ink); color:#fff; font-weight:700; font-size:12px;
    letter-spacing:0.02em; position:sticky; top:0;
  }
  .fitt-table thead th:first-child{background:#2a2e36}
  .fitt-table .row-label{
    background:var(--paper); font-weight:800; font-size:11px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--ink-soft); width:90px; white-space:nowrap;
  }
  .fitt-table td{color:var(--ink); line-height:1.55}
  .fitt-table .col-aerobic{border-top:3px solid var(--aerobic)}
  .fitt-table .col-resist{border-top:3px solid var(--resist)}
  .fitt-table .col-flex{border-top:3px solid var(--flex)}
  .fitt-table .col-extra{border-top:3px solid var(--extra)}

  /* 臨床區塊（原則 / 特別提醒） */
  .block{margin-bottom:18px}
  .block:last-child{margin-bottom:0}
  .block-h{
    font-size:14px; font-weight:800; color:var(--ink); margin-bottom:7px;
    padding-left:11px; border-left:3px solid var(--accent);
  }
  .block ul{list-style:none; padding-left:11px}
  .block li{
    font-size:13.5px; padding:3px 0 3px 18px; position:relative; line-height:1.6; color:var(--ink);
  }
  .block li::before{
    content:"–"; position:absolute; left:2px; color:var(--accent); font-weight:700;
  }
  .block li .sub{list-style:none; padding-left:14px; margin-top:2px}
  .block li .sub li{font-size:13px; color:var(--ink-soft); padding:2px 0 2px 16px}
  .block li .sub li::before{content:"·"; left:4px; font-size:16px; line-height:1}

  .clinical-wrap{
    background:#f7f9f9; border:1px solid var(--line); border-left:4px solid var(--accent);
    padding:18px 22px; margin-top:8px;
  }
  .special-wrap{
    background:var(--warn-bg); border:1px solid var(--warn-line); border-left:4px solid #c89b3c;
    padding:18px 22px; margin-top:8px;
  }
  .special-wrap .block-h{border-left-color:#c89b3c}
  .special-wrap .block li::before{color:#b5872a}

  /* 簡要重點(未補詳細的疾病) */
  .notes{
    background:var(--warn-bg); border:1px solid var(--warn-line); border-left:4px solid #c89b3c;
    padding:16px 20px; margin-top:8px;
  }
  .notes ul{list-style:none}
  .notes li{
    font-size:13.5px; padding:5px 0 5px 22px; position:relative; line-height:1.55;
  }
  .notes li::before{
    content:"▸"; position:absolute; left:2px; color:#b5872a; font-weight:700;
  }
  .pending{
    font-size:12.5px; color:var(--ink-soft); background:var(--accent-soft);
    border:1px dashed var(--accent); padding:10px 14px; margin-top:14px; line-height:1.6;
  }
  .pending b{color:var(--accent)}
  /* 狀態標籤 */
  .stag{display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; margin-left:6px; vertical-align:middle; letter-spacing:0.02em}
  .stag-full{background:var(--accent); color:#fff}
  .stag-approx{background:#e9d4a8; color:#7a5a18}
  .stag-none{background:#e3e6ec; color:#5a6270}
  .no-fitt{
    font-size:13.5px; color:var(--ink-soft); background:#f3f4f6; border:1px solid var(--line);
    border-left:4px solid #9aa3b2; padding:14px 18px; margin-top:8px; line-height:1.6;
  }
  .no-fitt b{color:var(--ink)}
  .approx-note{
    font-size:12.5px; color:#7a5a18; background:var(--warn-bg); border:1px solid var(--warn-line);
    padding:8px 12px; margin-bottom:10px; line-height:1.5;
  }
  /* 選單狀態小點 */
  .badge-todo{
    display:inline-block; font-size:9px; font-weight:700; color:#8a6d3b; background:#f5ead0;
    padding:1px 5px; margin-left:6px; vertical-align:middle;
  }
  .progress{
    font-size:11.5px; color:var(--ink-soft); padding:10px 22px 4px; line-height:1.8;
  }
  .progress b{color:var(--accent); font-size:13px}
  .prog-bar{display:inline-block; width:80px; height:6px; background:var(--line); vertical-align:middle; margin-left:4px}
  .prog-bar span{display:block; height:100%; background:var(--accent)}
  /* 核心原則總則區 */
  .cat-pill-principle{background:#1a3a5c; color:#fff}
  .p-section{margin:22px 0}
  .p-h{
    font-size:15px; font-weight:800; color:var(--ink); margin-bottom:9px;
    padding-bottom:6px; border-bottom:2px solid #1a3a5c; display:inline-block;
  }
  .p-body{font-size:14px; line-height:1.7; color:var(--ink); margin-bottom:8px}
  .p-list{list-style:none; padding-left:4px}
  .p-list>li{
    font-size:13.5px; padding:4px 0 4px 20px; position:relative; line-height:1.6; color:var(--ink);
  }
  .p-list>li::before{content:"▪"; position:absolute; left:4px; color:#1a3a5c; font-weight:700}
  .p-list .sub{list-style:none; padding-left:16px; margin-top:3px}
  .p-list .sub li{font-size:13px; color:var(--ink-soft); padding:2px 0 2px 16px; position:relative}
  .p-list .sub li::before{content:"–"; position:absolute; left:2px; color:var(--ink-soft)}
  .p-table{width:100%; border-collapse:collapse; font-size:13px; margin:6px 0}
  .p-table th,.p-table td{border:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top}
  .p-table thead th{background:#1a3a5c; color:#fff; font-weight:700; font-size:12px}
  .p-table tbody tr:nth-child(even){background:var(--paper)}
  /* ===== ACSM 11th 補充區塊 ===== */
  .acsm11-box{
    margin-top:32px; padding:18px 20px; background:#faf6ee;
    border:1px solid #e6d9bd; border-left:4px solid #b8893c;
  }
  .a11-tag{
    display:inline-block; font-size:11px; font-weight:800; letter-spacing:0.03em;
    color:#fff; background:#b8893c; padding:3px 10px; margin-bottom:12px;
  }
  .a11-page{font-size:11px; color:#9a7a3c; margin-bottom:10px; font-weight:600}
  .a11-sec{margin:14px 0}
  .a11-sec:first-of-type{margin-top:0}
  .a11-h{font-size:13.5px; font-weight:800; color:#6b5220; margin-bottom:6px;
    padding-left:9px; border-left:3px solid #b8893c;}
  .a11-body{font-size:13.5px; line-height:1.7; color:var(--ink); margin-bottom:6px}
  .a11-list{list-style:none; padding-left:4px}
  .a11-list>li{font-size:13px; padding:3px 0 3px 18px; position:relative; line-height:1.6; color:var(--ink)}
  .a11-list>li::before{content:"▪"; position:absolute; left:3px; color:#b8893c; font-weight:700}
  .a11-list .sub{list-style:none; padding-left:14px; margin-top:2px}
  .a11-list .sub li{font-size:12.5px; color:var(--ink-soft); padding:2px 0 2px 14px; position:relative}
  .a11-list .sub li::before{content:"–"; position:absolute; left:2px; color:var(--ink-soft)}
  .a11-table{width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0}
  .a11-table th,.a11-table td{border:1px solid #e0d3b5; padding:8px 11px; text-align:left; vertical-align:top}
  .a11-table thead th{background:#b8893c; color:#fff; font-weight:700; font-size:12px}
  .a11-table tbody tr:nth-child(even){background:#f5efe2}
  .disclaimer{
    margin-top:48px; padding-top:18px; border-top:1px solid var(--line);
    font-size:11.5px; color:var(--ink-soft); line-height:1.6;
  }
  /* 行動裝置 */
  .menu-toggle{display:none}
  @media(max-width:820px){
    body{flex-direction:column}
    .sidebar{width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--line)}
    .menu{max-height:0; overflow:hidden; transition:max-height .25s}
    .menu.open{max-height:60vh; overflow-y:auto}
    .menu-toggle{
      display:block; width:100%; padding:12px 22px; background:var(--accent); color:#fff;
      border:none; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; text-align:left;
    }
    .main{padding:24px 18px 60px}
    .doc-head h2{font-size:23px}
    .fitt-table{font-size:12px}
    .fitt-table th,.fitt-table td{padding:8px 9px}
    .fitt-table .row-label{width:64px}
    .fitt-wrap{overflow-x:auto}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <h1>ACSM 運動處方 <span class="tag">12TH</span></h1>
      <p>臨床族群心肺復健與 FITT 處方速查</p>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="搜尋疾病…（如 parkinson、糖尿病）" autocomplete="off">
    </div>
    <button class="menu-toggle" id="menuToggle">▤ 疾病選單</button>
    <nav class="menu" id="menu"></nav>
  </aside>

  <main class="main" id="main">
    <div class="empty" id="empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M3 5h18M3 12h18M3 19h12"/>
      </svg>
      <h2>選擇查詢區域</h2>
      <p>從左側選擇「核心原則」查詢運動測試與處方總則，或「臨床族群」查詢各疾病的心肺復健重點與 FITT 運動處方。也可直接用上方搜尋框查找。</p>
    </div>
    <article id="content" style="display:none"></article>
  </main>

<script src="data.js"></script>
<script>
  const menu = document.getElementById('menu');
  const content = document.getElementById('content');
  const empty = document.getElementById('empty');
  const search = document.getElementById('search');

  // ===== 階層式導覽 =====
  // 三大區:核心原則 / 心臟復健分期 / 臨床族群
  const PRINCIPLE_CAT = "核心原則 General Principles";
  const CR_CAT = "心臟復健分期 Cardiac Rehab Phases";
  const POP_CATS = CATEGORIES.filter(c=>c!==PRINCIPLE_CAT && c!==CR_CAT); // 7 大族群
  // 核心原則的章節順序(依 ACSM 書中章節)
  const PRINCIPLE_CHAPTERS = [
    "第1章 益處與風險 Benefits & Risks",
    "第2章 運動前評估 Preparticipation",
    "第3章 體適能測試 Fitness Testing",
    "第4章 臨床運動測試 Clinical Testing",
    "第5章 運動處方原則 Prescription",
  ];
  let navLevel = 'home';   // home | principle-chapters | principle-items | cr-items | pop-cats | pop-items
  let navCat = null;       // pop-items 時記住族群
  let navChapter = null;   // principle-items 時記住章節

  function buildMenu(filter=""){
    menu.innerHTML="";
    const f = filter.trim().toLowerCase();

    // 搜尋模式:跨全部攤平顯示,忽略階層
    if(f){
      const hits = DISEASES.filter(d=>
        d.name.toLowerCase().includes(f) || (d.en||'').toLowerCase().includes(f) ||
        (d.fullname||'').toLowerCase().includes(f) || d.id.includes(f));
      const lbl=document.createElement('div'); lbl.className='cat-label';
      lbl.textContent=`搜尋結果（${hits.length}）`; menu.appendChild(lbl);
      hits.forEach(d=>menu.appendChild(makeItem(d)));
      if(!hits.length){
        const e=document.createElement('div'); e.className='nav-empty';
        e.textContent='找不到符合的項目'; menu.appendChild(e);
      }
      return;
    }

    // 首頁:兩大按鈕
    if(navLevel==='home'){
      const intro=document.createElement('div'); intro.className='nav-intro';
      intro.textContent='請選擇要查詢的區域';
      menu.appendChild(intro);

      menu.appendChild(makeBigBtn('📋','核心原則','General Principles',
        `${PRINCIPLE_CHAPTERS.length} 章 · ${DISEASES.filter(d=>d.cat===PRINCIPLE_CAT).length} 個主題`,
        ()=>{navLevel='principle-chapters'; buildMenu();}));
      menu.appendChild(makeBigBtn('❤️','心臟復健分期','Cardiac Rehab Phases',
        `${DISEASES.filter(d=>d.cat===CR_CAT).length} 個主題（Phase I/II/III）`,
        ()=>{navLevel='cr-items'; buildMenu();}));
      menu.appendChild(makeBigBtn('🩺','臨床族群','Clinical Populations',
        `${POP_CATS.length} 大類 · ${DISEASES.filter(d=>POP_CATS.includes(d.cat)).length} 個情境`,
        ()=>{navLevel='pop-cats'; buildMenu();}));
      return;
    }

    // 核心原則:返回 + 列 5 章按鈕
    if(navLevel==='principle-chapters'){
      menu.appendChild(makeBack('← 返回首頁',()=>{navLevel='home'; buildMenu();}));
      const lbl=document.createElement('div'); lbl.className='cat-label'; lbl.textContent=PRINCIPLE_CAT;
      menu.appendChild(lbl);
      PRINCIPLE_CHAPTERS.forEach(ch=>{
        const n = DISEASES.filter(d=>d.cat===PRINCIPLE_CAT && d.chapter===ch).length;
        if(!n) return;
        menu.appendChild(makeCatBtn(ch, `${n} 個`, ()=>{navChapter=ch; navLevel='principle-items'; buildMenu();}));
      });
      return;
    }

    // 某章節下的主題
    if(navLevel==='principle-items'){
      menu.appendChild(makeBack('← 返回章節',()=>{navLevel='principle-chapters'; navChapter=null; buildMenu();}));
      const lbl=document.createElement('div'); lbl.className='cat-label'; lbl.textContent=navChapter;
      menu.appendChild(lbl);
      DISEASES.filter(d=>d.cat===PRINCIPLE_CAT && d.chapter===navChapter).forEach(d=>menu.appendChild(makeItem(d)));
      return;
    }

    // 心臟復健分期(單層,直接列 Phase I/II/III)
    if(navLevel==='cr-items'){
      menu.appendChild(makeBack('← 返回首頁',()=>{navLevel='home'; buildMenu();}));
      const lbl=document.createElement('div'); lbl.className='cat-label'; lbl.textContent=CR_CAT;
      menu.appendChild(lbl);
      DISEASES.filter(d=>d.cat===CR_CAT).forEach(d=>menu.appendChild(makeItem(d)));
      return;
    }

    // 臨床族群:返回 + 列 7 大族群按鈕
    if(navLevel==='pop-cats'){
      menu.appendChild(makeBack('← 返回首頁',()=>{navLevel='home'; buildMenu();}));
      const lbl=document.createElement('div'); lbl.className='cat-label'; lbl.textContent='臨床族群 Clinical Populations';
      menu.appendChild(lbl);
      POP_CATS.forEach(cat=>{
        const n = DISEASES.filter(d=>d.cat===cat).length;
        menu.appendChild(makeCatBtn(cat, `${n} 個`, ()=>{navCat=cat; navLevel='pop-items'; buildMenu();}));
      });
      return;
    }

    // 某族群下的疾病
    if(navLevel==='pop-items'){
      menu.appendChild(makeBack('← 返回族群分類',()=>{navLevel='pop-cats'; navCat=null; buildMenu();}));
      const lbl=document.createElement('div'); lbl.className='cat-label'; lbl.textContent=navCat;
      menu.appendChild(lbl);
      DISEASES.filter(d=>d.cat===navCat).forEach(d=>menu.appendChild(makeItem(d)));
      return;
    }
  }

  // 大按鈕(首頁兩大區)
  function makeBigBtn(icon,zh,en,sub,onclick){
    const b=document.createElement('button'); b.className='big-btn';
    b.innerHTML=`<span class="bb-icon">${icon}</span><span class="bb-text"><span class="bb-zh">${zh}</span><span class="bb-en">${en}</span><span class="bb-sub">${sub}</span></span><span class="bb-arrow">›</span>`;
    b.onclick=onclick; return b;
  }
  // 族群分類按鈕
  function makeCatBtn(cat,count,onclick){
    const b=document.createElement('button'); b.className='cat-btn';
    b.innerHTML=`<span class="cb-name">${cat}</span><span class="cb-count">${count}</span><span class="bb-arrow">›</span>`;
    b.onclick=onclick; return b;
  }
  // 返回按鈕
  function makeBack(label,onclick){
    const b=document.createElement('button'); b.className='back-btn';
    b.textContent=label; b.onclick=onclick; return b;
  }
  // 疾病/總則項目
  function makeItem(d){
    const b=document.createElement('button');
    b.className='menu-item'; b.dataset.id=d.id;
    const badge = d.detailed ? '<span class="badge-full">詳細</span>' : '<span class="badge-todo">待補</span>';
    b.innerHTML=`${d.name}${badge}<span class="en">${d.en}</span>`;
    b.onclick=()=>{show(d.id); if(window.innerWidth<=820){menu.classList.remove('open')}};
    return b;
  }

  function cell(obj,key){ return obj && obj[key] ? obj[key] : '—'; }

  function statusTag(s){
    if(s==='full') return '<span class="stag stag-full">有 FITT 表</span>';
    if(s==='approx') return '<span class="stag stag-approx">FITT 相關敘述</span>';
    if(s==='none') return '<span class="stag stag-none">僅 Special Considerations</span>';
    return '';
  }

  // 渲染一組 block（標題+條目，支援巢狀 sub）
  function renderBlocks(blocks){
    return blocks.map(b=>{
      const lis = b.items.map(it=>{
        if(typeof it === 'string') return `<li>${it}</li>`;
        // 物件：{t:主條目, sub:[子條目]}
        const sub = it.sub ? `<ul class="sub">${it.sub.map(s=>`<li>${s}</li>`).join('')}</ul>` : '';
        return `<li>${it.t}${sub}</li>`;
      }).join('');
      return `<div class="block"><div class="block-h">${b.h}</div><ul>${lis}</ul></div>`;
    }).join('');
  }

  function show(id){
    const d = DISEASES.find(x=>x.id===id);
    if(!d) return;
    document.querySelectorAll('.menu-item').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
    empty.style.display='none'; content.style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});

    // ===== ACSM 11th 補充區塊(若該主題有 acsm11 欄位才顯示)=====
    function renderACSM11(d){
      const a = d.acsm11;
      if(!a) return '';
      // a 可為:字串(單段) 或 {pageStr, blocks:[{h, body, list, table}]}
      let inner='';
      if(typeof a === 'string'){
        inner = `<p class="a11-body">${a}</p>`;
      } else {
        const pg = a.pageStr ? `<div class="a11-page">ACSM 11th · 參見 PDF 第 ${a.pageStr} 頁</div>` : '';
        inner = pg + (a.blocks||[]).map(s=>{
          const body = s.body ? `<p class="a11-body">${s.body}</p>` : '';
          const list = (s.list&&s.list.length) ? `<ul class="a11-list">${s.list.map(it=>{
            if(typeof it==='string') return `<li>${it}</li>`;
            const sub = it.sub ? `<ul class="sub">${it.sub.map(x=>`<li>${x}</li>`).join('')}</ul>`:'';
            return `<li>${it.t}${sub}</li>`;
          }).join('')}</ul>` : '';
          let table='';
          if(s.table && s.table.rows){
            const head = s.table.head ? `<thead><tr>${s.table.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`:'';
            const rows = s.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
            table = `<table class="a11-table">${head}<tbody>${rows}</tbody></table>`;
          }
          const h = s.h ? `<div class="a11-h">${s.h}</div>` : '';
          return `<div class="a11-sec">${h}${body}${list}${table}</div>`;
        }).join('');
      }
      return `<div class="acsm11-box">
        <div class="a11-tag">ACSM 11th 補充 · 與 12 版的異同 / 11 版獨有內容</div>
        ${inner}
      </div>`;
    }

    // ===== 核心原則(知識型,非 FITT)=====
    if(d.kind==='principle'){
      const secHTML = (d.sections||[]).map(s=>{
        const list = (s.list && s.list.length)
          ? `<ul class="p-list">${s.list.map(it=>{
              if(typeof it==='string') return `<li>${it}</li>`;
              const sub = it.sub ? `<ul class="sub">${it.sub.map(x=>`<li>${x}</li>`).join('')}</ul>`:'';
              return `<li>${it.t}${sub}</li>`;
            }).join('')}</ul>` : '';
        let table='';
        if(s.table && s.table.rows){
          const head = s.table.head ? `<thead><tr>${s.table.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`:'';
          const rows = s.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
          table = `<table class="p-table">${head}<tbody>${rows}</tbody></table>`;
        }
        const body = s.body ? `<p class="p-body">${s.body}</p>`:'';
        return `<div class="p-section"><div class="p-h">${s.h}</div>${body}${list}${table}</div>`;
      }).join('');

      const pendingNote = !d.detailed ? `
        <div class="pending">📝 此主題目前為<b>骨架（待補）</b>。請用 Claude Code 依「補充指令_總則篇.md」，
        從 ACSM 第 <b>${d.pageStr||d.page}</b> 頁整理完整內容並更新 data.js。</div>` : '';

      content.innerHTML = `
        <div class="doc-head">
          <span class="cat-pill cat-pill-principle">核心原則 General Principles</span>
          <h2>${d.fullname||d.name}</h2>
          <div class="en-title">${d.desc||''}</div>
          <div class="page-ref">ACSM 第 12 版 · 參見 PDF 第 <b>${d.pageStr||d.page}</b> 頁</div>
        </div>
        ${secHTML}
        ${pendingNote}
        ${renderACSM11(d)}
        <div class="disclaimer">
          內容整理自 <i>ACSM's Guidelines for Exercise Testing and Prescription, 12th Edition</i>，供個人學習速查之用。
          實際應用請以原書完整內文（第 ${d.pageStr||d.page} 頁）為準。
        </div>`;
      return;
    }

    const hasExtra = !!d.extra;
    const cols = ['有氧 Aerobic','阻力 Resistance','柔軟度 Flexibility'];
    if(hasExtra) cols.push(d.extra.label);
    const colClass=['col-aerobic','col-resist','col-flex','col-extra'];

    function rowCells(key){
      let h=`<td class="${colClass[0]}">${cell(d.aerobic,key)}</td>`;
      h+=`<td class="${colClass[1]}">${cell(d.resistance,key)}</td>`;
      h+=`<td class="${colClass[2]}">${cell(d.flex,key)}</td>`;
      if(hasExtra) h+=`<td class="${colClass[3]}">${cell(d.extra,key)}</td>`;
      return h;
    }

    // 一、臨床原則與注意事項
    let clinicalHTML = '';
    if(d.clinical && d.clinical.length){
      if(d.detailed){
        clinicalHTML = `
          <div class="section-label">一、臨床原則與注意事項</div>
          <div class="clinical-wrap">${renderBlocks(d.clinical)}</div>`;
      }
    }

    // 二、FITT — 依 status 決定呈現
    let fittHTML='';
    if(d.status==='none'){
      fittHTML = `
        <div class="section-label">${d.detailed?'二、':''}運動處方 FITT-VP</div>
        <div class="no-fitt">此情境在 ACSM 第 12 版中<b>沒有獨立的 FITT 處方表格</b>，重點請見下方臨床原則與特別提醒。</div>`;
    } else {
      const approxNote = d.status==='approx'
        ? `<div class="approx-note">⚠ 書中無獨立 FITT 表，以下為相關敘述或參照鄰近情境的整理。</div>` : '';
      fittHTML = `
        <div class="section-label">${d.detailed?'二、':''}運動處方 FITT-VP</div>
        ${approxNote}
        <div class="fitt-wrap">
        <table class="fitt-table">
          <thead><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
          <tbody>
            <tr><td class="row-label">Frequency 頻率</td>${rowCells('f')}</tr>
            <tr><td class="row-label">Intensity 強度</td>${rowCells('i')}</tr>
            <tr><td class="row-label">Time 時間</td>${rowCells('t')}</tr>
            <tr><td class="row-label">Type 類型</td>${rowCells('ty')}</tr>
          </tbody>
        </table>
        </div>`;
    }

    // 三、特別提醒 / 或簡要重點
    let specialHTML = '';
    if(d.detailed && d.special && d.special.length){
      specialHTML = `
        <div class="section-label">三、特別提醒 Special Considerations</div>
        <div class="special-wrap">${renderBlocks(d.special)}</div>`;
    } else if(!d.detailed){
      // 未補詳細：顯示簡要重點 + 待補提示
      const noteItems = (d.clinical && d.clinical[0] && d.clinical[0].items)
        ? d.clinical[0].items.map(n=>`<li>${typeof n==='string'?n:n.t}</li>`).join('') : '';
      specialHTML = `
        <div class="section-label">臨床重點</div>
        <div class="notes"><ul>${noteItems}</ul></div>
        <div class="pending">
          📝 此情境目前為<b>骨架（待補）</b>。請用你的 Claude Code 依照 <b>補充指令.md</b>，
          從 ACSM 第 <b>${d.pageStr||d.page}</b> 頁整理完整內容並更新 data.js，即可變成詳細版。
        </div>`;
    }

    content.innerHTML = `
      <div class="doc-head">
        <span class="cat-pill">${d.cat}</span>
        <h2>${d.name}</h2>
        <div class="en-title">${d.en}</div>
        <div class="page-ref">ACSM 第 12 版 · 參見 PDF 第 <b>${d.pageStr||d.page}</b> 頁 ${statusTag(d.status)}</div>
      </div>
      ${clinicalHTML}
      ${fittHTML}
      ${specialHTML}
      ${renderACSM11(d)}
      <div class="disclaimer">
        內容整理自 <i>ACSM's Guidelines for Exercise Testing and Prescription, 12th Edition</i>，供個人學習速查之用。
        實際臨床處方請以原書完整內文（第 ${d.page} 頁）及病人個別狀況為準。
        縮寫：HRR 心率儲備、VO₂R 攝氧儲備、1-RM 最大反覆、RPE 自覺費力、HRmax 最大心率。
      </div>
    `;
  }

  document.getElementById('menuToggle').onclick=()=>menu.classList.toggle('open');
  search.addEventListener('input',e=>buildMenu(e.target.value));
  buildMenu();
</script>
</body>
</html>
